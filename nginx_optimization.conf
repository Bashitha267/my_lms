# ============================================================
# Nginx Optimization Config for LMS PHP App
# ============================================================
# HOW TO USE:
#   1. SSH into your VPS
#   2. Edit your site config:
#        nano /etc/nginx/sites-available/your-site.conf
#   3. Paste the relevant blocks below into your server{} block
#   4. Test and reload:
#        nginx -t && systemctl reload nginx
# ============================================================

# ── Gzip Compression ─────────────────────────────────────────
# Add this INSIDE your http{} block in /etc/nginx/nginx.conf
# (not inside server{})
#
# gzip on;
# gzip_vary on;
# gzip_proxied any;
# gzip_comp_level 6;
# gzip_buffers 16 8k;
# gzip_http_version 1.1;
# gzip_min_length 256;
# gzip_types
#     text/plain
#     text/css
#     text/javascript
#     application/javascript
#     application/json
#     application/x-javascript
#     text/xml
#     application/xml
#     application/xml+rss
#     text/html
#     font/woff
#     font/woff2
#     image/svg+xml;

# ── Your server{} block should look like this: ───────────────

server {
    listen 80;
    # listen 443 ssl; # Uncomment when using HTTPS
    server_name yourdomain.com www.yourdomain.com;

    root /var/www/html;  # Change to your actual web root
    index index.php index.html;

    # ── PHP-FPM FastCGI ──────────────────────────────────────
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;  # Adjust PHP version
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # Timeouts — generous for page loads but not infinite
        fastcgi_read_timeout 60;
        fastcgi_send_timeout 60;
        fastcgi_connect_timeout 10;

        # Buffer tuning — reduces round trips for PHP output
        fastcgi_buffer_size 32k;
        fastcgi_buffers 8 16k;
        fastcgi_busy_buffers_size 32k;

        # Hide PHP version for security
        fastcgi_hide_header X-Powered-By;
    }

    # ── Static Asset Caching ─────────────────────────────────
    # Browsers cache these for 1 year — massive improvement for repeat visits
    location ~* \.(jpg|jpeg|png|gif|ico|webp|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary Accept-Encoding;
        access_log off;
    }

    location ~* \.(css|js)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary Accept-Encoding;
        access_log off;
    }

    location ~* \.(woff|woff2|ttf|eot|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        access_log off;
    }

    # ── Security Headers ─────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Keep-Alive ───────────────────────────────────────────
    keepalive_timeout 65;
    keepalive_requests 100;

    # ── Upload Size (for profile pictures, files etc.) ───────
    client_max_body_size 20M;

    # ── Deny access to sensitive files ───────────────────────
    location ~* \.(sql|log|sh|env)$ {
        deny all;
    }

    location ~ /\. {
        deny all;
    }

    # ── Main location block ──────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
}

# ============================================================
# PHP-FPM Pool Tuning (/etc/php/8.x/fpm/pool.d/www.conf)
# ============================================================
# Replace or merge with your existing pool settings:
#
# pm = dynamic
# pm.max_children = 20          ; Max concurrent PHP workers
# pm.start_servers = 4          ; Workers started at boot
# pm.min_spare_servers = 2      ; Min idle workers
# pm.max_spare_servers = 6      ; Max idle workers
# pm.max_requests = 500         ; Restart worker after N requests (prevents memory leaks)
# pm.process_idle_timeout = 10s
#
# After editing run: systemctl restart php8.2-fpm
# ============================================================
