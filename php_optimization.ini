; ============================================================
; PHP OPcache & Performance Settings for LMS on Nginx VPS
; ============================================================
; HOW TO USE:
;   Option A — Paste into /etc/php/8.x/fpm/php.ini  (affects PHP-FPM)
;   Option B — Create /etc/php/8.x/fpm/conf.d/99-lms-optimizations.ini
;              and paste everything below (easier to manage)
;
;   After saving, restart PHP-FPM:
;       systemctl restart php8.2-fpm
;       (replace 8.2 with your PHP version: php -v to check)
;
;   Verify OPcache is active:
;       php -r "var_dump(opcache_get_status());"
; ============================================================

; ── OPcache (MOST IMPORTANT — eliminates PHP re-parsing) ────
; OPcache caches compiled PHP bytecode in shared memory.
; Without it, PHP re-parses EVERY .php file on EVERY request.
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=128       ; MB of shared memory for cached bytecode
opcache.interned_strings_buffer=16   ; MB for interned strings
opcache.max_accelerated_files=4000   ; Max number of PHP files to cache
opcache.revalidate_freq=60           ; Check for file changes every 60s (not every request)
opcache.validate_timestamps=1        ; Set to 0 in production if you never hot-edit files
opcache.save_comments=0              ; Skip docblock parsing (saves memory)
opcache.fast_shutdown=1              ; Faster PHP worker recycling

; ── Session Optimization ─────────────────────────────────────
; Use file-based sessions (default) but write lazily
session.lazy_write=1                 ; Don't write session if data didn't change
session.gc_divisor=1000              ; Run GC less frequently (1 in 1000 requests)
session.gc_probability=1
session.gc_maxlifetime=1440          ; 24 minutes

; ── Output Buffering ─────────────────────────────────────────
output_buffering=4096                ; Buffer output — reduces write syscalls

; ── MySQL / PDO ──────────────────────────────────────────────
; These reduce connection overhead per request
mysqli.allow_persistent=On
mysqli.max_persistent=-1             ; Unlimited persistent connections

; ── Execution Limits ─────────────────────────────────────────
max_execution_time=30                ; 30s max per request (was likely default 30)
max_input_time=30
memory_limit=128M                    ; Per-request memory cap

; ── File Upload Limits (for profile pics, docs etc.) ─────────
upload_max_filesize=10M
post_max_size=20M

; ── Realpath Cache (reduces filesystem stat() calls) ─────────
realpath_cache_size=4096k
realpath_cache_ttl=600               ; Cache file paths for 10 minutes

; ── Error Logging (errors log to file, not displayed) ────────
log_errors=On
error_log=/var/log/php/lms_errors.log
; Make sure the log directory exists:
;   mkdir -p /var/log/php && chown www-data:www-data /var/log/php

; ============================================================
; QUICK VERIFICATION COMMANDS (run on VPS after applying):
;
;   # Check OPcache is loaded:
;   php -m | grep -i opcache
;
;   # See OPcache stats:
;   php -r "print_r(opcache_get_status(false));"
;
;   # Check session.lazy_write:
;   php -i | grep lazy_write
;
;   # Reload PHP-FPM after changes:
;   systemctl restart php8.2-fpm && systemctl status php8.2-fpm
; ============================================================
